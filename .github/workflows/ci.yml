name: AIVISION checks

on:
  pull_request:
  push:
    branches:
      - main
      - feat/aivision-light-glassmorphism

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
